<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Recuperar senha — OrçaZap
    </title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f8f6;
            color: #13261d;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 10px;

            margin-bottom: 25px;

            font-size: 25px;
            font-weight: bold;

            color: #087f4f;
        }

        .logo-icon {
            width: 42px;
            height: 42px;

            border-radius: 50%;

            background: #08a865;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 21px;
        }

        .card {
            background: white;

            border: 1px solid #e0e8e3;

            border-radius: 16px;

            padding: 32px;

            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, .04);
        }

        h1 {
            font-size: 25px;
            margin-bottom: 9px;
            text-align: center;
        }

        .description {
            color: #718078;
            font-size: 14px;
            line-height: 1.5;

            text-align: center;

            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;
            font-weight: bold;

            color: #42594e;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d8e4dd;

            border-radius: 9px;

            outline: none;

            font-size: 14px;
        }

        input:focus {
            border-color: #08a865;

            box-shadow:
                0 0 0 3px
                rgba(8, 168, 101, .10);
        }

        .btn {
            width: 100%;

            border: none;

            border-radius: 9px;

            padding: 13px;

            background: #08a865;

            color: white;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;
        }

        .btn:hover {
            background: #078c55;
        }

        .btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .message {
            display: none;

            padding: 13px;

            margin-bottom: 18px;

            border-radius: 8px;

            font-size: 13px;

            line-height: 1.4;
        }

        .message.success {
            display: block;

            background: #eafaf1;

            color: #087f4f;

            border: 1px solid #c8eed9;
        }

        .message.error {
            display: block;

            background: #fff1f1;

            color: #b42318;

            border: 1px solid #ffd5d5;
        }

        .back {
            text-align: center;

            margin-top: 22px;

            font-size: 13px;
        }

        .back a {
            color: #087f4f;
            font-weight: bold;
            text-decoration: none;
        }

        .back a:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="logo">

        <div class="logo-icon">
            O
        </div>

        OrçaZap

    </div>


    <div class="card">


        <h1>
            Esqueceu sua senha?
        </h1>


        <p class="description">

            Digite o e-mail da sua conta.
            Enviaremos um link para você criar uma nova senha.

        </p>


        <div
            id="mensagem"
            class="message"
        ></div>


        <form id="recuperarForm">


            <div class="form-group">

                <label for="email">
                    Seu e-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="seuemail@exemplo.com"
                    autocomplete="email"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn"
                id="enviarBtn"
            >

                Enviar link de recuperação

            </button>


        </form>


        <div class="back">

            <a href="login.html">

                ← Voltar para o login

            </a>

        </div>


    </div>


</div>


<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script>

    const SUPABASE_URL =
        "https://kceprnuvyrtnmbmknnwj.supabase.co";


    const SUPABASE_KEY =
        "COLE_AQUI_A_MESMA_SB_PUBLISHABLE";


    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    const formulario =
        document.getElementById(
            "recuperarForm"
        );


    const mensagem =
        document.getElementById(
            "mensagem"
        );


    const enviarBtn =
        document.getElementById(
            "enviarBtn"
        );


    function mostrarMensagem(
        texto,
        tipo
    ) {

        mensagem.textContent =
            texto;

        mensagem.className =
            "message " + tipo;
    }


    formulario.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            mensagem.className =
                "message";

            mensagem.textContent =
                "";


            const email =
                document.getElementById(
                    "email"
                )
                .value
                .trim();


            if (!email) {

                mostrarMensagem(
                    "Digite seu e-mail.",
                    "error"
                );

                return;
            }


            enviarBtn.disabled =
                true;


            enviarBtn.textContent =
                "Enviando...";


            try {


                const {
                    error
                } =
                    await supabaseClient
                        .auth
                        .resetPasswordForEmail(
                            email,
                            {

                                redirectTo:
                                    "https://egiliobicudondev-design.github.io/orcazap/redefinir-senha.html"

                            }
                        );


                if (error) {

                    throw error;
                }


                mostrarMensagem(

                    "Se existir uma conta com esse e-mail, você receberá um link para redefinir sua senha. Confira também a caixa de spam.",

                    "success"

                );


                document.getElementById(
                    "email"
                ).value =
                    "";


            } catch (error) {


                console.error(
                    error
                );


                mostrarMensagem(
                    "Não foi possível enviar o e-mail: " +
                    error.message,
                    "error"
                );

            }


            enviarBtn.disabled =
                false;


            enviarBtn.textContent =
                "Enviar link de recuperação";

        }
    );

</script>


</body>

</html>
