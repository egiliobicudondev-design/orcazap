<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clientes — OrçaZap</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f8f6;
            color: #13261d;
        }

        .app {
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 240px;
            background: white;
            border-right: 1px solid #e1e9e4;
            padding: 24px 18px;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 21px;
            font-weight: bold;
            color: #087f4f;
            margin-bottom: 35px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #08a865;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu a {
            display: block;
            text-decoration: none;
            color: #4f665b;
            padding: 12px 13px;
            border-radius: 9px;
            margin-bottom: 7px;
            font-size: 14px;
        }

        .menu a:hover,
        .menu a.active {
            background: #e8f8ef;
            color: #087f4f;
            font-weight: bold;
        }

        .logout {
            position: absolute;
            bottom: 25px;
            left: 18px;
            right: 18px;
        }

        .logout button {
            width: 100%;
            padding: 11px;
            border: 1px solid #dce7e1;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            color: #a33;
            font-weight: bold;
        }

        .content {
            margin-left: 240px;
            width: calc(100% - 240px);
        }

        .topbar {
            height: 75px;
            padding: 0 35px;
            background: white;
            border-bottom: 1px solid #e1e9e4;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .company-name {
            font-size: 14px;
            color: #5d7167;
        }

        .user-email {
            font-size: 13px;
            color: #718078;
        }

        main {
            max-width: 1300px;
            margin: auto;
            padding: 35px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 30px;
            margin-bottom: 7px;
        }

        .page-header p {
            color: #718078;
        }

        .btn {
            border: none;
            border-radius: 9px;
            padding: 12px 18px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .btn-primary {
            background: #08a865;
            color: white;
        }

        .btn-primary:hover {
            background: #078c55;
        }

        .btn-secondary {
            background: white;
            color: #17352a;
            border: 1px solid #dbe6e0;
        }

        .search-area {
            background: white;
            border: 1px solid #e0e8e3;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .search-area input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #d8e4dd;
            border-radius: 9px;
            outline: none;
            font-size: 14px;
        }

        .search-area input:focus {
            border-color: #08a865;
            box-shadow: 0 0 0 3px rgba(8,168,101,0.10);
        }

        .card {
            background: white;
            border: 1px solid #e0e8e3;
            border-radius: 14px;
            overflow: hidden;
        }

        .card-header {
            padding: 20px;
            border-bottom: 1px solid #e8eeea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-header h2 {
            font-size: 18px;
        }

        .contador {
            color: #718078;
            font-size: 13px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 15px 20px;
            text-align: left;
            border-bottom: 1px solid #edf1ef;
            font-size: 14px;
        }

        th {
            color: #718078;
            font-size: 12px;
            text-transform: uppercase;
        }

        .acoes {
            display: flex;
            gap: 7px;
        }

        .btn-edit {
            border: 1px solid #d8e4dd;
            background: white;
            border-radius: 7px;
            padding: 7px 10px;
            cursor: pointer;
        }

        .btn-delete {
            border: 1px solid #ffd5d5;
            color: #b42318;
            background: #fff7f7;
            border-radius: 7px;
            padding: 7px 10px;
            cursor: pointer;
        }

        .empty {
            padding: 55px 20px;
            text-align: center;
            color: #718078;
        }

        /* MODAL */

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.40);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: white;
            width: 100%;
            max-width: 540px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.20);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-header h2 {
            font-size: 22px;
        }

        .close {
            border: none;
            background: #f0f4f2;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #d8e4dd;
            border-radius: 8px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #08a865;
            box-shadow: 0 0 0 3px rgba(8,168,101,0.10);
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 22px;
        }

        .message {
            display: none;
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
        }

        .message.error {
            display: block;
            color: #b42318;
            background: #fff1f1;
            border: 1px solid #ffd5d5;
        }

        .message.success {
            display: block;
            color: #087f4f;
            background: #eafaf1;
            border: 1px solid #c8eed9;
        }

        @media (max-width: 900px) {

            .sidebar {
                display: none;
            }

            .content {
                margin-left: 0;
                width: 100%;
            }
        }

        @media (max-width: 650px) {

            main {
                padding: 22px 15px;
            }

            .topbar {
                padding: 0 15px;
            }

            .page-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .page-header .btn {
                width: 100%;
            }

            .card {
                overflow-x: auto;
            }

            table {
                min-width: 750px;
            }

            .modal {
                padding: 22px 18px;
            }

            .modal-buttons {
                flex-direction: column-reverse;
            }

            .modal-buttons button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">O</div>
            OrçaZap
        </div>

        <nav class="menu">
            <a href="dashboard.html">📊 Dashboard</a>
            <a href="clientes.html" class="active">👥 Clientes</a>
            <a href="orcamentos.html">📄 Orçamentos</a>
            <a href="novo-orcamento.html">➕ Novo orçamento</a>
            <a href="configuracoes.html">⚙️ Configurações</a>
        </nav>

        <div class="logout">
            <button id="logoutBtn">
                Sair da conta
            </button>
        </div>

    </aside>


    <div class="content">

        <header class="topbar">

            <div
                class="company-name"
                id="companyName"
            >
                Carregando empresa...
            </div>

            <div
                class="user-email"
                id="userEmail"
            ></div>

        </header>


        <main>

            <div class="page-header">

                <div>
                    <h1>Clientes</h1>
                    <p>
                        Cadastre e organize seus clientes.
                    </p>
                </div>

                <button
                    class="btn btn-primary"
                    id="novoClienteBtn"
                >
                    + Novo cliente
                </button>

            </div>


            <div
                id="paginaMensagem"
                class="message"
            ></div>


            <div class="search-area">

                <input
                    type="text"
                    id="pesquisa"
                    placeholder="🔎 Pesquisar por nome, telefone ou e-mail..."
                >

            </div>


            <div class="card">

                <div class="card-header">

                    <h2>Seus clientes</h2>

                    <span
                        class="contador"
                        id="contadorClientes"
                    >
                        0 clientes
                    </span>

                </div>


                <div id="clientesArea">

                    <div class="empty">
                        Carregando clientes...
                    </div>

                </div>

            </div>

        </main>

    </div>

</div>


<!-- MODAL -->

<div
    class="modal-overlay"
    id="modalOverlay"
>

    <div class="modal">

        <div class="modal-header">

            <h2 id="modalTitulo">
                Novo cliente
            </h2>

            <button
                class="close"
                id="fecharModal"
                type="button"
            >
                ×
            </button>

        </div>


        <div
            id="modalMensagem"
            class="message"
        ></div>


        <form id="clienteForm">

            <input
                type="hidden"
                id="clienteId"
            >


            <div class="form-group">

                <label for="nome">
                    Nome *
                </label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Ex.: João da Silva"
                    required
                >

            </div>


            <div class="form-group">

                <label for="telefone">
                    WhatsApp
                </label>

                <input
                    type="tel"
                    id="telefone"
                    placeholder="(14) 99999-9999"
                >

            </div>


            <div class="form-group">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="cliente@email.com"
                >

            </div>


            <div class="form-group">

                <label for="documento">
                    CPF/CNPJ
                </label>

                <input
                    type="text"
                    id="documento"
                    placeholder="Opcional"
                >

            </div>


            <div class="form-group">

                <label for="endereco">
                    Endereço
                </label>

                <input
                    type="text"
                    id="endereco"
                    placeholder="Rua, número, bairro, cidade..."
                >

            </div>


            <div class="form-group">

                <label for="observacoes">
                    Observações
                </label>

                <textarea
                    id="observacoes"
                    placeholder="Informações adicionais sobre o cliente..."
                ></textarea>

            </div>


            <div class="modal-buttons">

                <button
                    type="button"
                    class="btn btn-secondary"
                    id="cancelarBtn"
                >
                    Cancelar
                </button>

                <button
                    type="submit"
                    class="btn btn-primary"
                    id="salvarBtn"
                >
                    Salvar cliente
                </button>

            </div>

        </form>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    const SUPABASE_URL =
        "https://kceprnuvyrtnmbmknnwj.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_aZPRlsOse9AxSJCjroHGRA_CaJlrNKo";


    const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


    let companyId = null;

    let clientes = [];


    const clientesArea =
        document.getElementById("clientesArea");

    const pesquisa =
        document.getElementById("pesquisa");

    const modalOverlay =
        document.getElementById("modalOverlay");

    const clienteForm =
        document.getElementById("clienteForm");

    const modalMensagem =
        document.getElementById("modalMensagem");

    const paginaMensagem =
        document.getElementById("paginaMensagem");


    function mostrarMensagem(
        elemento,
        texto,
        tipo
    ) {

        elemento.textContent = texto;

        elemento.className =
            "message " + tipo;
    }


    function limparMensagem(elemento) {

        elemento.textContent = "";

        elemento.className = "message";
    }


    async function iniciarPagina() {

        try {

            /*
                CONFERE SE EXISTE
                USUÁRIO LOGADO
            */

            const {
                data: { user },
                error: userError
            } =
                await supabaseClient.auth.getUser();


            if (userError || !user) {

                window.location.href =
                    "login.html";

                return;
            }


            document.getElementById(
                "userEmail"
            ).textContent =
                user.email;


            /*
                BUSCA EMPRESA
            */

            const {
                data: company,
                error: companyError
            } =
                await supabaseClient
                    .from("companies")
                    .select("id, name")
                    .eq(
                        "user_id",
                        user.id
                    )
                    .maybeSingle();


            if (companyError) {
                throw companyError;
            }


            if (!company) {

                throw new Error(
                    "Empresa não encontrada."
                );
            }


            companyId = company.id;


            document.getElementById(
                "companyName"
            ).textContent =
                company.name;


            await carregarClientes();

        } catch (error) {

            console.error(error);

            mostrarMensagem(
                paginaMensagem,
                "Erro ao carregar a página: " +
                error.message,
                "error"
            );
        }
    }


    async function carregarClientes() {

        clientesArea.innerHTML = `
            <div class="empty">
                Carregando clientes...
            </div>
        `;


        const {
            data,
            error
        } =
            await supabaseClient
                .from("clients")
                .select(`
                    id,
                    name,
                    phone,
                    email,
                    document,
                    address,
                    notes,
                    created_at
                `)
                .eq(
                    "company_id",
                    companyId
                )
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (error) {

            console.error(error);

            clientesArea.innerHTML = `
                <div class="empty">
                    Não foi possível carregar os clientes.
                </div>
            `;

            return;
        }


        clientes = data || [];


        mostrarClientes(clientes);
    }


    function mostrarClientes(lista) {

        const contador =
            document.getElementById(
                "contadorClientes"
            );


        contador.textContent =
            lista.length === 1
                ? "1 cliente"
                : lista.length + " clientes";


        if (lista.length === 0) {

            clientesArea.innerHTML = `
                <div class="empty">

                    Nenhum cliente encontrado.

                    <br><br>

                    <button
                        class="btn btn-primary"
                        onclick="abrirNovoCliente()"
                    >
                        + Cadastrar cliente
                    </button>

                </div>
            `;

            return;
        }


        clientesArea.innerHTML = `
            <table>

                <thead>

                    <tr>
                        <th>Nome</th>
                        <th>WhatsApp</th>
                        <th>E-mail</th>
                        <th>CPF/CNPJ</th>
                        <th>Ações</th>
                    </tr>

                </thead>

                <tbody id="clientesTabela">
                </tbody>

            </table>
        `;


        const tbody =
            document.getElementById(
                "clientesTabela"
            );


        lista.forEach(function(cliente) {

            const tr =
                document.createElement("tr");


            const nome =
                document.createElement("td");

            nome.textContent =
                cliente.name || "-";


            const telefone =
                document.createElement("td");

            telefone.textContent =
                cliente.phone || "-";


            const email =
                document.createElement("td");

            email.textContent =
                cliente.email || "-";


            const documento =
                document.createElement("td");

            documento.textContent =
                cliente.document || "-";


            const acoes =
                document.createElement("td");

            acoes.className = "acoes";


            const editar =
                document.createElement("button");

            editar.className =
                "btn-edit";

            editar.textContent =
                "Editar";

            editar.addEventListener(
                "click",
                function() {

                    editarCliente(
                        cliente.id
                    );
                }
            );


            const excluir =
                document.createElement("button");

            excluir.className =
                "btn-delete";

            excluir.textContent =
                "Excluir";

            excluir.addEventListener(
                "click",
                function() {

                    excluirCliente(
                        cliente.id,
                        cliente.name
                    );
                }
            );


            acoes.appendChild(editar);
            acoes.appendChild(excluir);


            tr.appendChild(nome);
            tr.appendChild(telefone);
            tr.appendChild(email);
            tr.appendChild(documento);
            tr.appendChild(acoes);


            tbody.appendChild(tr);
        });
    }


    /*
        PESQUISA
    */

    pesquisa.addEventListener(
        "input",
        function() {

            const termo =
                pesquisa.value
                    .toLowerCase()
                    .trim();


            if (!termo) {

                mostrarClientes(clientes);

                return;
            }


            const filtrados =
                clientes.filter(
                    function(cliente) {

                        return (
                            (
                                cliente.name || ""
                            )
                            .toLowerCase()
                            .includes(termo)

                            ||

                            (
                                cliente.phone || ""
                            )
                            .toLowerCase()
                            .includes(termo)

                            ||

                            (
                                cliente.email || ""
                            )
                            .toLowerCase()
                            .includes(termo)
                        );
                    }
                );


            mostrarClientes(filtrados);
        }
    );


    /*
        NOVO CLIENTE
    */

    function abrirNovoCliente() {

        clienteForm.reset();

        document.getElementById(
            "clienteId"
        ).value = "";


        document.getElementById(
            "modalTitulo"
        ).textContent =
            "Novo cliente";


        document.getElementById(
            "salvarBtn"
        ).textContent =
            "Salvar cliente";


        limparMensagem(
            modalMensagem
        );


        modalOverlay.classList.add(
            "show"
        );


        document.getElementById(
            "nome"
        ).focus();
    }


    document.getElementById(
        "novoClienteBtn"
    ).addEventListener(
        "click",
        abrirNovoCliente
    );


    /*
        EDITAR
    */

    function editarCliente(id) {

        const cliente =
            clientes.find(
                function(item) {
                    return item.id === id;
                }
            );


        if (!cliente) {
            return;
        }


        document.getElementById(
            "clienteId"
        ).value =
            cliente.id;


        document.getElementById(
            "nome"
        ).value =
            cliente.name || "";


        document.getElementById(
            "telefone"
        ).value =
            cliente.phone || "";


        document.getElementById(
            "email"
        ).value =
            cliente.email || "";


        document.getElementById(
            "documento"
        ).value =
            cliente.document || "";


        document.getElementById(
            "endereco"
        ).value =
            cliente.address || "";


        document.getElementById(
            "observacoes"
        ).value =
            cliente.notes || "";


        document.getElementById(
            "modalTitulo"
        ).textContent =
            "Editar cliente";


        document.getElementById(
            "salvarBtn"
        ).textContent =
            "Salvar alterações";


        limparMensagem(
            modalMensagem
        );


        modalOverlay.classList.add(
            "show"
        );
    }


    /*
        SALVAR
    */

    clienteForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            limparMensagem(
                modalMensagem
            );


            const id =
                document.getElementById(
                    "clienteId"
                ).value;


            const nome =
                document.getElementById(
                    "nome"
                ).value.trim();


            const telefone =
                document.getElementById(
                    "telefone"
                ).value.trim();


            const email =
                document.getElementById(
                    "email"
                ).value.trim();


            const documento =
                document.getElementById(
                    "documento"
                ).value.trim();


            const endereco =
                document.getElementById(
                    "endereco"
                ).value.trim();


            const observacoes =
                document.getElementById(
                    "observacoes"
                ).value.trim();


            if (!nome) {

                mostrarMensagem(
                    modalMensagem,
                    "Digite o nome do cliente.",
                    "error"
                );

                return;
            }


            const botao =
                document.getElementById(
                    "salvarBtn"
                );


            botao.disabled = true;

            botao.textContent =
                "Salvando...";


            try {

                if (id) {

                    /*
                        EDITANDO CLIENTE
                    */

                    const {
                        error
                    } =
                        await supabaseClient
                            .from("clients")
                            .update({
                                name: nome,
                                phone:
                                    telefone || null,
                                email:
                                    email || null,
                                document:
                                    documento || null,
                                address:
                                    endereco || null,
                                notes:
                                    observacoes || null
                            })
                            .eq(
                                "id",
                                id
                            )
                            .eq(
                                "company_id",
                                companyId
                            );


                    if (error) {
                        throw error;
                    }


                    mostrarMensagem(
                        modalMensagem,
                        "Cliente atualizado com sucesso!",
                        "success"
                    );

                } else {

                    /*
                        NOVO CLIENTE
                    */

                    const {
                        error
                    } =
                        await supabaseClient
                            .from("clients")
                            .insert({
                                company_id:
                                    companyId,

                                name:
                                    nome,

                                phone:
                                    telefone || null,

                                email:
                                    email || null,

                                document:
                                    documento || null,

                                address:
                                    endereco || null,

                                notes:
                                    observacoes || null
                            });


                    if (error) {
                        throw error;
                    }


                    mostrarMensagem(
                        modalMensagem,
                        "Cliente cadastrado com sucesso!",
                        "success"
                    );
                }


                await carregarClientes();


                setTimeout(
                    function() {

                        fecharModal();

                    },
                    700
                );


            } catch (error) {

                console.error(error);


                mostrarMensagem(
                    modalMensagem,
                    "Não foi possível salvar o cliente: " +
                    error.message,
                    "error"
                );


            } finally {

                botao.disabled = false;

                botao.textContent =
                    id
                        ? "Salvar alterações"
                        : "Salvar cliente";
            }
        }
    );


    /*
        EXCLUIR
    */

    async function excluirCliente(
        id,
        nome
    ) {

        const confirmar =
            confirm(
                'Deseja excluir o cliente "' +
                nome +
                '"?'
            );


        if (!confirmar) {
            return;
        }


        try {

            /*
                PRIMEIRO CONFERE SE EXISTEM
                ORÇAMENTOS DESSE CLIENTE
            */

            const {
                count,
                error: countError
            } =
                await supabaseClient
                    .from("quotes")
                    .select(
                        "*",
                        {
                            count: "exact",
                            head: true
                        }
                    )
                    .eq(
                        "client_id",
                        id
                    );


            if (countError) {
                throw countError;
            }


            if (count > 0) {

                alert(
                    "Este cliente possui " +
                    count +
                    " orçamento(s).\n\n" +
                    "Ele não poderá ser excluído enquanto possuir orçamentos."
                );

                return;
            }


            const {
                error
            } =
                await supabaseClient
                    .from("clients")
                    .delete()
                    .eq(
                        "id",
                        id
                    )
                    .eq(
                        "company_id",
                        companyId
                    );


            if (error) {
                throw error;
            }


            mostrarMensagem(
                paginaMensagem,
                "Cliente excluído com sucesso.",
                "success"
            );


            await carregarClientes();


            setTimeout(
                function() {
                    limparMensagem(
                        paginaMensagem
                    );
                },
                2500
            );


        } catch (error) {

            console.error(error);


            mostrarMensagem(
                paginaMensagem,
                "Não foi possível excluir o cliente: " +
                error.message,
                "error"
            );
        }
    }


    /*
        FECHAR MODAL
    */

    function fecharModal() {

        modalOverlay.classList.remove(
            "show"
        );

        clienteForm.reset();

        limparMensagem(
            modalMensagem
        );
    }


    document.getElementById(
        "fecharModal"
    ).addEventListener(
        "click",
        fecharModal
    );


    document.getElementById(
        "cancelarBtn"
    ).addEventListener(
        "click",
        fecharModal
    );


    modalOverlay.addEventListener(
        "click",
        function(event) {

            if (
                event.target ===
                modalOverlay
            ) {

                fecharModal();
            }
        }
    );


    /*
        LOGOUT
    */

    document.getElementById(
        "logoutBtn"
    ).addEventListener(
        "click",
        async function() {

            await supabaseClient
                .auth
                .signOut();


            window.location.href =
                "login.html";
        }
    );


    /*
        INICIA
    */

    iniciarPagina();

</script>

</body>
</html>
