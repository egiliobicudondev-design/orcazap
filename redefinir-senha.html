<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Criar nova senha — OrçaZap</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f8f6;
            color: #13261d;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 10px;

            margin-bottom: 25px;

            font-size: 25px;
            font-weight: bold;

            color: #087f4f;
        }

        .logo-icon {
            width: 42px;
            height: 42px;

            border-radius: 50%;

            background: #08a865;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 21px;
        }

        .card {
            background: white;

            border: 1px solid #e0e8e3;

            border-radius: 16px;

            padding: 32px;

            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, .04);
        }

        h1 {
            font-size: 25px;
            margin-bottom: 9px;
            text-align: center;
        }

        .description {
            text-align: center;

            color: #718078;

            line-height: 1.5;

            font-size: 14px;

            margin-bottom: 28px;
        }

        .loading {
            text-align: center;
            color: #718078;
            padding: 20px 0;
            font-size: 14px;
        }

        #senhaArea {
            display: none;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;
            font-weight: bold;

            color: #42594e;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d8e4dd;

            border-radius: 9px;

            outline: none;

            font-size: 14px;
        }

        input:focus {
            border-color: #08a865;

            box-shadow:
                0 0 0 3px
                rgba(8, 168, 101, .10);
        }

        .password-info {
            font-size: 12px;

            color: #718078;

            margin-top: 6px;
        }

        .btn {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 9px;

            background: #08a865;

            color: white;

            cursor: pointer;

            font-size: 14px;

            font-weight: bold;
        }

        .btn:hover {
            background: #078c55;
        }

        .btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .message {
            display: none;

            padding: 13px;

            border-radius: 8px;

            margin-bottom: 18px;

            font-size: 13px;

            line-height: 1.4;
        }

        .message.success {
            display: block;

            background: #eafaf1;

            color: #087f4f;

            border: 1px solid #c8eed9;
        }

        .message.error {
            display: block;

            background: #fff1f1;

            color: #b42318;

            border: 1px solid #ffd5d5;
        }

        .back {
            text-align: center;

            margin-top: 22px;

            font-size: 13px;
        }

        .back a {
            text-decoration: none;

            color: #087f4f;

            font-weight: bold;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="logo">

        <div class="logo-icon">
            O
        </div>

        OrçaZap

    </div>


    <div class="card">


        <h1>
            Criar nova senha
        </h1>


        <p class="description">
            Escolha uma nova senha para acessar sua conta.
        </p>


        <div
            id="mensagem"
            class="message"
        ></div>


        <div
            id="carregando"
            class="loading"
        >
            Verificando link de recuperação...
        </div>


        <div id="senhaArea">


            <form id="senhaForm">


                <div class="form-group">

                    <label for="novaSenha">
                        Nova senha
                    </label>


                    <input
                        type="password"
                        id="novaSenha"
                        placeholder="Digite sua nova senha"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >


                    <div class="password-info">
                        Use pelo menos 8 caracteres.
                    </div>

                </div>


                <div class="form-group">

                    <label for="confirmarSenha">
                        Confirmar nova senha
                    </label>


                    <input
                        type="password"
                        id="confirmarSenha"
                        placeholder="Digite novamente"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn"
                    id="salvarBtn"
                >
                    Salvar nova senha
                </button>


            </form>


        </div>


        <div class="back">

            <a href="login.html">
                ← Voltar para o login
            </a>

        </div>


    </div>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

    /* =========================================
       SUPABASE
    ========================================= */

    const SUPABASE_URL =
        "https://kceprnuvyrtnmbmknnwj.supabase.co";


    const SUPABASE_KEY =
        "sb_publishable_aZPRlsOse9AxSJCjroHGRA_CaJlrNKo";


    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY,
            {
                auth: {
                    detectSessionInUrl: true,
                    persistSession: true
                }
            }
        );


    /* =========================================
       ELEMENTOS
    ========================================= */

    const mensagem =
        document.getElementById(
            "mensagem"
        );


    const carregando =
        document.getElementById(
            "carregando"
        );


    const senhaArea =
        document.getElementById(
            "senhaArea"
        );


    const salvarBtn =
        document.getElementById(
            "salvarBtn"
        );


    let podeAlterarSenha =
        false;


    /* =========================================
       MENSAGENS
    ========================================= */

    function mostrarMensagem(
        texto,
        tipo
    ) {

        mensagem.textContent =
            texto;


        mensagem.className =
            "message " + tipo;
    }


    function liberarFormulario() {

        podeAlterarSenha =
            true;


        carregando.style.display =
            "none";


        senhaArea.style.display =
            "block";


        mensagem.className =
            "message";


        mensagem.textContent =
            "";
    }


    function mostrarLinkInvalido(
        detalhe = ""
    ) {

        podeAlterarSenha =
            false;


        carregando.style.display =
            "none";


        senhaArea.style.display =
            "none";


        let texto =
            "O link de recuperação é inválido ou expirou. Solicite um novo link.";


        if (detalhe) {

            console.error(
                "Detalhe recuperação:",
                detalhe
            );
        }


        mostrarMensagem(
            texto,
            "error"
        );
    }


    /* =========================================
       PROCESSAR LINK
    ========================================= */

    async function processarLinkRecuperacao() {

        try {

            /*
                1 - VERIFICA ERRO NA URL
            */

            const query =
                new URLSearchParams(
                    window.location.search
                );


            const erroQuery =
                query.get(
                    "error_description"
                );


            const hash =
                new URLSearchParams(
                    window.location.hash
                        .replace("#", "")
                );


            const erroHash =
                hash.get(
                    "error_description"
                );


            if (
                erroQuery ||
                erroHash
            ) {

                mostrarLinkInvalido(
                    erroQuery ||
                    erroHash
                );


                return;
            }


            /*
                2 - FLUXO PKCE

                Se voltar com:
                ?code=xxxxx
            */

            const code =
                query.get(
                    "code"
                );


            if (code) {

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .auth
                        .exchangeCodeForSession(
                            code
                        );


                if (error) {

                    throw error;
                }


                if (
                    data &&
                    data.session
                ) {

                    liberarFormulario();


                    limparURL();


                    return;
                }
            }


            /*
                3 - FLUXO IMPLICIT

                Se voltar com:
                #access_token=...
                &refresh_token=...
            */

            const accessToken =
                hash.get(
                    "access_token"
                );


            const refreshToken =
                hash.get(
                    "refresh_token"
                );


            if (
                accessToken &&
                refreshToken
            ) {

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .auth
                        .setSession({

                            access_token:
                                accessToken,

                            refresh_token:
                                refreshToken

                        });


                if (error) {

                    throw error;
                }


                if (
                    data &&
                    data.session
                ) {

                    liberarFormulario();


                    limparURL();


                    return;
                }
            }


            /*
                4 - TALVEZ O SUPABASE
                JÁ TENHA PROCESSADO A URL
            */

            await new Promise(
                function(resolve) {

                    setTimeout(
                        resolve,
                        500
                    );

                }
            );


            const {
                data: sessionData,
                error: sessionError
            } =
                await supabaseClient
                    .auth
                    .getSession();


            if (sessionError) {

                throw sessionError;
            }


            if (
                sessionData &&
                sessionData.session
            ) {

                liberarFormulario();


                limparURL();


                return;
            }


            /*
                SE CHEGOU AQUI,
                NÃO FOI POSSÍVEL CRIAR SESSÃO
            */

            mostrarLinkInvalido(
                "Nenhuma sessão de recuperação encontrada."
            );


        } catch (error) {

            console.error(
                "Erro ao processar recuperação:",
                error
            );


            mostrarLinkInvalido(
                error.message
            );
        }
    }


    /* =========================================
       LIMPAR TOKEN DA BARRA DO NAVEGADOR
    ========================================= */

    function limparURL() {

        if (
            window.history &&
            window.history.replaceState
        ) {

            window.history.replaceState(
                {},
                document.title,
                window.location.pathname
            );
        }
    }


    /* =========================================
       EVENTOS DO SUPABASE
    ========================================= */

    supabaseClient
        .auth
        .onAuthStateChange(
            function(
                event,
                session
            ) {

                console.log(
                    "Auth:",
                    event
                );


                if (
                    event ===
                    "PASSWORD_RECOVERY" &&
                    session
                ) {

                    liberarFormulario();


                    limparURL();
                }
            }
        );


    /* =========================================
       SALVAR NOVA SENHA
    ========================================= */

    document.getElementById(
        "senhaForm"
    ).addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            if (
                !podeAlterarSenha
            ) {

                mostrarMensagem(
                    "O link de recuperação não está mais válido.",
                    "error"
                );


                return;
            }


            const novaSenha =
                document.getElementById(
                    "novaSenha"
                ).value;


            const confirmarSenha =
                document.getElementById(
                    "confirmarSenha"
                ).value;


            if (
                novaSenha.length < 8
            ) {

                mostrarMensagem(
                    "A senha precisa ter pelo menos 8 caracteres.",
                    "error"
                );


                return;
            }


            if (
                novaSenha !==
                confirmarSenha
            ) {

                mostrarMensagem(
                    "As duas senhas não são iguais.",
                    "error"
                );


                return;
            }


            salvarBtn.disabled =
                true;


            salvarBtn.textContent =
                "Salvando...";


            try {

                /*
                    ATUALIZA A SENHA
                */

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .auth
                        .updateUser({

                            password:
                                novaSenha

                        });


                if (error) {

                    throw error;
                }


                mostrarMensagem(
                    "Senha alterada com sucesso! Redirecionando para o login...",
                    "success"
                );


                document.getElementById(
                    "novaSenha"
                ).value =
                    "";


                document.getElementById(
                    "confirmarSenha"
                ).value =
                    "";


                /*
                    ENCERRA A SESSÃO
                */

                await supabaseClient
                    .auth
                    .signOut();


                setTimeout(
                    function() {

                        window.location.href =
                            "login.html";

                    },
                    1800
                );


            } catch (error) {

                console.error(
                    "Erro ao trocar senha:",
                    error
                );


                mostrarMensagem(
                    "Não foi possível alterar a senha: " +
                    error.message,
                    "error"
                );


                salvarBtn.disabled =
                    false;


                salvarBtn.textContent =
                    "Salvar nova senha";
            }

        }
    );


    /* =========================================
       INICIAR
    ========================================= */

    processarLinkRecuperacao();


</script>


</body>

</html>
